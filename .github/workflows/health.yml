name: Monitor public discovery feed health
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */2 * * *'
permissions:
  contents: read
jobs:
  health:
    if: github.ref == 'refs/heads/main' && vars.DISCOVERY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python scripts/check_health.py --max-age-hours 36
